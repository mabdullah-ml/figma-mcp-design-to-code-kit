name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  design-to-code-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run Figma MCP Codegen CLI
        run: npm run codegen
      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm test
      - name: Production Next.js Build
        run: npm run build
